# Mpv config
profile=high-quality
video-sync=display-resample
interpolation=no

keep-open=yes
autofit-larger=90%x90%
background-color="#181818"
force-window=yes

save-position-on-quit=yes
watch-later-options=start,volume,mute,sid,aid
volume=70
volume-max=130

alang=jpn,eng,en
slang=eng,en
audio-file-auto=fuzzy

sub-auto=fuzzy
sub-font="sans-serif"
sub-font-size=44
sub-bold=yes
sub-color="#f4f4ff"
sub-border-color="#181818"
sub-border-size=2.4
sub-shadow-offset=0
sub-back-color="#00000000"

osd-font="sans-serif"
osd-font-size=32
osd-color="#e4e4ef"
osd-border-color="#181818"
osd-border-size=2
osd-bar-align-y=0.9
osd-duration=1500

screenshot-format=png
screenshot-directory="~/Pictures/screenshots"
screenshot-template="%F-%P"
