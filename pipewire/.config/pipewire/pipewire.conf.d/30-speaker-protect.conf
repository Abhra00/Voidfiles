context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Speaker Protect"
      media.name = "Speaker Protect"
      filter.graph = {
        nodes = [
          { type = builtin label = bq_highpass name = hp1L control = { "Freq" = 150.0 "Q" = 0.5412 } }
          { type = builtin label = bq_highpass name = hp2L control = { "Freq" = 150.0 "Q" = 1.3066 } }
          { type = builtin label = linear name = gainL control = { "Mult" = 0.7 } }
          { type = builtin label = bq_highpass name = hp1R control = { "Freq" = 150.0 "Q" = 0.5412 } }
          { type = builtin label = bq_highpass name = hp2R control = { "Freq" = 150.0 "Q" = 1.3066 } }
          { type = builtin label = linear name = gainR control = { "Mult" = 0.7 } }
        ]
        links = [
          { output = "hp1L:Out" input = "hp2L:In" }
          { output = "hp2L:Out" input = "gainL:In" }
          { output = "hp1R:Out" input = "hp2R:In" }
          { output = "hp2R:Out" input = "gainR:In" }
        ]
        inputs = [ "hp1L:In" "hp1R:In" ]
        outputs = [ "gainL:Out" "gainR:Out" ]
      }
      capture.props = {
        node.name = "speaker_protect"
        media.class = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
        priority.session = 2000
      }
      playback.props = {
        node.name = "speaker_protect.output"
        node.passive = true
        audio.channels = 2
        audio.position = [ FL FR ]
        target.object = "alsa_output.pci-0000_05_00.6.analog-stereo"
      }
    }
  }
]
